apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounts-mock
  namespace: deposit
  labels:
    app: accounts-mock
    app.kubernetes.io/name: accounts-mock
    app.kubernetes.io/part-of: banking-microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: accounts-mock
  template:
    metadata:
      labels:
        app: accounts-mock
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: accounts-mock
          image: 881893826841.dkr.ecr.us-east-1.amazonaws.com/deposit:v1
          command:
            - uvicorn
            - mocks.accounts_service_mock:app
            - --host
            - 0.0.0.0
            - --port
            - "8081"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          volumeMounts:
            - name: mock-code
              mountPath: /app/mocks
          readinessProbe:
            httpGet:
              path: /health/live
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
      volumes:
        - name: mock-code
          configMap:
            name: accounts-mock-code
---
apiVersion: v1
kind: Service
metadata:
  name: accounts-service
  namespace: deposit
  labels:
    app: accounts-mock
    app.kubernetes.io/name: accounts-mock
    app.kubernetes.io/part-of: banking-microservices
spec:
  type: ClusterIP
  selector:
    app: accounts-mock
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      protocol: TCP

