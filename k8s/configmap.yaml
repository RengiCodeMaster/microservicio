apiVersion: v1
kind: ConfigMap
metadata:
  name: deposit-config
  namespace: deposit
  labels:
    app.kubernetes.io/name: deposit
    app.kubernetes.io/part-of: banking-microservices
data:
  APP_NAME: "usd-deposit-service"
  ENV: "production"
  PORT: "8000"
  LOG_LEVEL: "INFO"
  # Base de datos: ruta con volumen dedicado para persistencia
  DATABASE_URL: "sqlite+aiosqlite:////app/data/deposits.db"
  # URL interna del Microservicio de Cuentas (Mock en namespace deposit)
  ACCOUNTS_SERVICE_URL: "http://accounts-service.deposit.svc.cluster.local:8081"
  ACCOUNTS_SERVICE_TIMEOUT_SEC: "5.0"
  # Reglas de negocio financieras
  DAILY_LIMIT_USD: "20000.00"
  AML_THRESHOLD_USD: "10000.00"
  MIN_DEPOSIT_USD: "1.00"
  MAX_DIGITAL_DEPOSIT_USD: "5000.00"
  MAX_BRANCH_DEPOSIT_USD: "50000.00"
