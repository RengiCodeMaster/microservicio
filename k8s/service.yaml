apiVersion: v1
kind: Service
metadata:
  name: deposit
  namespace: deposit
  labels:
    app: deposit
    app.kubernetes.io/name: deposit
    app.kubernetes.io/part-of: banking-microservices
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  loadBalancerSourceRanges:
    - 190.43.149.147/32
  selector:
    app: deposit
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
