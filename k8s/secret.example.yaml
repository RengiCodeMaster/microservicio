apiVersion: v1
kind: Secret
metadata:
  name: deposit-secrets
  namespace: deposit
  labels:
    app.kubernetes.io/name: deposit
    app.kubernetes.io/part-of: banking-microservices
type: Opaque
# ADVERTENCIA: Este archivo es una plantilla de ejemplo.
# NO guardes contraseñas ni tokens de producción reales en git.
# Crea el secret en el clúster ejecutando:
# kubectl create secret generic deposit-secrets --namespace deposit \
#   --from-literal=ACCOUNTS_SERVICE_AUTH_TOKEN="Bearer TU_TOKEN_AQUI" \
#   --dry-run=client -o yaml | kubectl apply -f -
stringData:
  ACCOUNTS_SERVICE_AUTH_TOKEN: "Bearer dev-sample-token"

